name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test
        run: |
          python -m py_compile parcel.py scripts/claude_adapter.py
          python -m unittest discover -s tests -v
      - name: Verify durable DID binding
        run: |
          python -m pip install cryptography==50.0.0
          curl -fsSL \
            https://raw.githubusercontent.com/danenright/technocore-contributor-onboarding/2d9cfc6feca8e53d66c26cdc7d2ca14c3fa05dc7/verify_attestation.py \
            -o /tmp/verify_attestation.py
          echo "883dedb5dea5f10fbfe30b03900e7e7d96e925c2e0d94664f7b0783eb6faa57b  /tmp/verify_attestation.py" | sha256sum -c -
          python /tmp/verify_attestation.py ATTESTATION.json
